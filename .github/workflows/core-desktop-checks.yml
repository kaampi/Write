name: Core desktop bridge checks

on:
  push:
    branches:
      - "feat/core-desktop-*"
    paths:
      - "src-tauri/**"
      - "src/persistence/CoreDesktopTransport.ts"
      - ".github/workflows/core-desktop-checks.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/persistence/CoreDesktopTransport.ts"
      - ".github/workflows/core-desktop-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native Core bridge
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
