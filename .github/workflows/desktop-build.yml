name: Desktop build (Windows)

# Builds the Tauri desktop launcher (roadmap-ideas.md #35). Windows-only for
# now, matching the current plan — no macOS/Linux targets configured in
# src-tauri/tauri.conf.json yet. Manually triggered, plus a self-check on any
# push to main that touches the desktop project, so a broken build surfaces
# immediately instead of silently rotting until someone runs it by hand.
#
# Unsigned build: no code-signing secrets are configured (see roadmap-ideas.md
# #35 — deferred until there's a budget for it). The resulting .exe will
# trigger a Windows SmartScreen warning; that's expected for now, not a
# failure of this workflow.
# Also publishes a GitHub Release (tagged v<package.json version>) with the
# .exe attached, so there's a permanent download link that doesn't expire
# after 90 days like a plain workflow-run artifact, and something the
# in-app "Check for updates" feature (roadmap-ideas.md #35) can compare
# against. Re-running on the same version updates that release's asset
# in place rather than failing on an existing tag.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # package-lock.json's @ocedo-apps/storycore entry pins its own
      # "resolved" URL in SSH form (git+ssh://git@github.com/...) — that's
      # npm's own canonical form for a GitHub git dependency, and it comes
      # back every time the lockfile is regenerated regardless of what
      # protocol the dependency was declared with, so it isn't something a
      # one-off lockfile edit can fix for good. This runner has no SSH key
      # for GitHub (only the HTTPS token actions/checkout already set up),
      # so `npm ci` failed outright on that package with "Permission denied
      # (publickey)" — every build since the dependency was added, right up
      # to this fix. Rewriting the URL at the git level, same as this
      # project's own dev sandbox already does the other direction, makes
      # npm's git fetch go over HTTPS regardless of which form is on record.
      - name: Fetch GitHub git dependencies over HTTPS, not SSH
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Upload the Windows installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-ai-windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog section
        id: changelog
        shell: bash
        run: |
          awk '/^## \[/{n++} n==1{print} n==2{exit}' CHANGELOG.md > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      # A second copy with a fixed, version-free name — the online-installer
      # stub (installer-stub/, see roadmap-ideas.md #35) downloads this exact
      # filename via GitHub's stable ".../releases/latest/download/<name>"
      # pattern, so it always fetches the current version without needing to
      # know the version number or call the GitHub API.
      - name: Copy installer under a fixed filename
        shell: bash
        run: |
          src=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          cp "$src" "StoryBook-AI-Setup.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: kaampi Write v${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            StoryBook-AI-Setup.exe
          fail_on_unmatched_files: true
