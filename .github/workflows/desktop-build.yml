name: Desktop build (Windows, Linux, macOS)

# Builds the Tauri desktop launcher (roadmap-ideas.md #35) for Windows,
# Linux, and macOS (tauri.conf.json's bundle.targets lists
# nsis/deb/appimage/app/dmg together - each OS's build only produces the
# targets that apply to it, the others are silently skipped by the
# bundler). The macOS job couldn't be built-and-verified in this project's
# own Linux dev sandbox the way the Linux job was (Tauri's macOS backend
# needs Apple's own Objective-C toolchain/SDK, which isn't available to
# cross-compile from Linux) - it leans on this workflow's own
# windows-latest/ubuntu-latest/macos-latest runners for real verification,
# same trust model the Windows build has always had here. Manually
# triggered, plus a self-check on any push to main that touches the desktop
# project, so a broken build surfaces immediately instead of silently
# rotting until someone runs it by hand.
#
# Unsigned builds: no code-signing secrets are configured (see
# roadmap-ideas.md #35 — deferred until there's a budget for it). The
# Windows .exe will trigger a SmartScreen warning; that's expected. The
# macOS .app/.dmg are unsigned AND unnotarized - macOS Gatekeeper refuses
# to open them at all from a plain double-click ("app is damaged" or
# "unidentified developer"), not just a warning dialog like Windows/Linux
# - see docs/running.md for the right-click-Open/xattr workaround users
# need until there's a budget for an Apple Developer ID.
# All three jobs publish to the SAME GitHub Release (tagged v<package.json
# version>) - one release per version, with each platform's own installer
# assets attached, so there's a permanent download link that doesn't expire
# after 90 days like a plain workflow-run artifact, and something the
# in-app "Check for updates" feature (roadmap-ideas.md #35) can compare
# against. Re-running on the same version updates that release's assets in
# place rather than failing on an existing tag.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # package-lock.json's @ocedo-apps/storycore entry pins its own
      # "resolved" URL in SSH form (git+ssh://git@github.com/...) — that's
      # npm's own canonical form for a GitHub git dependency, and it comes
      # back every time the lockfile is regenerated regardless of what
      # protocol the dependency was declared with, so it isn't something a
      # one-off lockfile edit can fix for good. This runner has no SSH key
      # for GitHub (only the HTTPS token actions/checkout already set up),
      # so `npm ci` failed outright on that package with "Permission denied
      # (publickey)" — every build since the dependency was added, right up
      # to this fix. Rewriting the URL at the git level, same as this
      # project's own dev sandbox already does the other direction, makes
      # npm's git fetch go over HTTPS regardless of which form is on record.
      - name: Fetch GitHub git dependencies over HTTPS, not SSH
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Upload the Windows installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-ai-windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog section
        id: changelog
        shell: bash
        run: |
          awk '/^## \[/{n++} n==1{print} n==2{exit}' CHANGELOG.md > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      # A second copy with a fixed, version-free name — the online-installer
      # stub (installer-stub/, see roadmap-ideas.md #35) downloads this exact
      # filename via GitHub's stable ".../releases/latest/download/<name>"
      # pattern, so it always fetches the current version without needing to
      # know the version number or call the GitHub API.
      - name: Copy installer under a fixed filename
        shell: bash
        run: |
          src=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          cp "$src" "StoryBook-AI-Setup.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: kaampi Write v${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            StoryBook-AI-Setup.exe
          fail_on_unmatched_files: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same fix as the Windows job - see its own comment above.
      - name: Fetch GitHub git dependencies over HTTPS, not SSH
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Tauri's own Linux runtime deps (webkit2gtk, gtk3, the system tray
      # bits) plus patchelf, which the AppImage bundler shells out to.
      # Verified against a real build in the dev sandbox first (also
      # Ubuntu 24.04/noble) before writing this list, rather than guessing
      # from Tauri's own docs alone.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-unknown-linux-gnu

      - name: Upload the Linux bundles (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-ai-linux-bundles
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog section
        id: changelog
        run: |
          awk '/^## \[/{n++} n==1{print} n==2{exit}' CHANGELOG.md > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: kaampi Write v${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same fix as the Windows/Linux jobs - see the Windows job's own comment.
      - name: Fetch GitHub git dependencies over HTTPS, not SSH
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # One binary that runs natively on both Apple Silicon and Intel
          # Macs, rather than two separate downloads - a non-technical
          # author shouldn't have to know their own Mac's chip (the same
          # "don't make them pick" reasoning roadmap-ideas.md #35 already
          # applies to the Windows installer).
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin

      - name: Upload the macOS bundles (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-ai-macos-bundles
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog section
        id: changelog
        run: |
          awk '/^## \[/{n++} n==1{print} n==2{exit}' CHANGELOG.md > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: kaampi Write v${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
