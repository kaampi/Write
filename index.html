<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kaampi Write</title>
    <script>
      try {
        if (localStorage.getItem("storybook-ai.theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
        var loc = localStorage.getItem("storybook-ai.locale");
        if (loc) {
          document.documentElement.lang = loc.split("-")[0];
          document.documentElement.dataset.locale = loc;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
