[package]
name = "storybook-ai-desktop"
version = "0.1.0"
description = "Desktop launcher for kaampi Write — serves the app locally, no separate install steps."
authors = ["ocedo-apps"]
license = ""
repository = "https://github.com/kaampi/Write"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2.8.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["linux-native", "sync-secret-service", "vendored"] }
